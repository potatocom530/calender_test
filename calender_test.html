<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 공유 캘린더</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      
      --color-saturday: #2563eb;
      --color-sunday: #dc2626;

      --cat-work: #3b82f6;
      --cat-personal: #10b981;
      --cat-important: #ef4444;
      --cat-holiday: #e11d48;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    /* 비밀번호 인증 레이어 */
    #authOverlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .auth-box {
      background: white;
      padding: 32px;
      border-radius: 16px;
      text-align: center;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .auth-box h2 { margin-bottom: 8px; font-size: 1.4rem; }
    .auth-box p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }
    .auth-box input {
      width: 100%; padding: 12px; border: 1px solid var(--border-color);
      border-radius: 8px; margin-bottom: 12px; font-size: 1rem; outline: none;
    }

    .app-container {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
    }

    @media (max-width: 850px) {
      .app-container { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .calendar-header h2 { font-size: 1.5rem; font-weight: 700; }

    .nav-btns button {
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .nav-btns button:hover { background: #f1f5f9; }

    .grid-weekdays, .grid-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
    }

    .grid-weekdays {
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .grid-weekdays div { padding: 8px 0; }
    .grid-weekdays div:first-child { color: var(--color-sunday); }
    .grid-weekdays div:last-child { color: var(--color-saturday); }

    .grid-days { gap: 6px; }

    .day-cell {
      min-height: 90px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 6px;
      text-align: left;
      cursor: pointer;
      background: #fff;
      transition: border-color 0.2s, background 0.2s;
      display: flex;
      flex-direction: column;
    }

    .day-cell:hover { border-color: var(--primary-color); background: #f4f5ff; }
    .day-cell.empty { background: transparent; border: none; cursor: default; }
    .day-cell.today { background: #eef2ff; border-color: var(--primary-color); }

    .day-number { font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    .day-cell.sat .day-number { color: var(--color-saturday); }
    .day-cell.sun .day-number,
    .day-cell.holiday .day-number { color: var(--color-sunday); }

    .event-dots { display: flex; flex-direction: column; gap: 3px; overflow: hidden; }

    .event-badge {
      font-size: 0.7rem;
      padding: 2px 4px;
      border-radius: 4px;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar h3 { font-size: 1.2rem; margin-bottom: 16px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input, .form-group select {
      width: 100%; padding: 10px; border: 1px solid var(--border-color);
      border-radius: 8px; outline: none; font-size: 0.9rem;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary-color); }

    .btn-submit {
      width: 100%; background: var(--primary-color); color: white;
      border: none; padding: 10px; border-radius: 8px; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    .btn-submit:hover { background: var(--primary-hover); }

    .event-list {
      margin-top: 24px; display: flex; flex-direction: column;
      gap: 8px; max-height: 280px; overflow-y: auto;
    }

    .event-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px; border: 1px solid var(--border-color);
      border-radius: 8px; background: #fafafa;
    }

    .event-info { display: flex; flex-direction: column; }
    .event-title { font-size: 0.9rem; font-weight: 600; }
    .event-author { font-size: 0.75rem; color: var(--primary-color); font-weight: 500; }
    .event-date { font-size: 0.75rem; color: var(--text-muted); }

    .btn-delete {
      background: none; border: none; color: #94a3b8;
      cursor: pointer; font-size: 1.1rem;
    }
    .btn-delete:hover { color: var(--cat-important); }

    .bg-work { background-color: var(--cat-work); }
    .bg-personal { background-color: var(--cat-personal); }
    .bg-important { background-color: var(--cat-important); }
    .bg-holiday { background-color: var(--cat-holiday); }
  </style>
</head>
<body>

  <!-- 비밀번호 및 작성자 입력 레이어 -->
  <div id="authOverlay">
    <div class="auth-box">
      <h2>🔒 캘린더 접속</h2>
      <p>공유받은 비밀번호를 입력하세요.</p>
      <input type="password" id="accessPassword" placeholder="비밀번호 입력">
      <input type="text" id="userName" placeholder="내 이름 (예: 홍길동)" value="익명">
      <button class="btn-submit" id="btnAuth">입장하기</button>
    </div>
  </div>

  <div class="app-container">
    <div class="card">
      <div class="calendar-header">
        <h2 id="monthYear"></h2>
        <div class="nav-btns">
          <button id="prevBtn">&lt; 이전</button>
          <button id="todayBtn">오늘</button>
          <button id="nextBtn">다음 &gt;</button>
        </div>
      </div>

      <div class="grid-weekdays">
        <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
      </div>

      <div class="grid-days" id="calendarGrid"></div>
    </div>

    <div class="sidebar">
      <div class="card">
        <h3>새 일정 등록</h3>
        <form id="eventForm">
          <div class="form-group">
            <label for="eventTitle">일정 제목</label>
            <input type="text" id="eventTitle" placeholder="예: 팀 회의" required>
          </div>
          <div class="form-group">
            <label for="eventDate">날짜</label>
            <input type="date" id="eventDate" required>
          </div>
          <div class="form-group">
            <label for="eventCategory">카테고리</label>
            <select id="eventCategory">
              <option value="work">업무</option>
              <option value="personal">개인</option>
              <option value="important">중요</option>
            </select>
          </div>
          <button type="submit" class="btn-submit">일정 공유하기</button>
        </form>

        <h3 style="margin-top: 24px;">공유된 일정 목록</h3>
        <div class="event-list" id="eventList"></div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK 모듈 로드 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ----------------------------------------------------
    // [설정 1] 접속 비밀번호
    const SHARE_PASSWORD = "0987"; // 원하는 비밀번호 지정

    // [설정 2] Firebase 연결 정보 (1단계에서 복사한 값)
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyA4YGzWCDYlhRVui6aELfFeg4Y0-34t2eQ",
  authDomain: "shared-calendar-322ce.firebaseapp.com",
  projectId: "shared-calendar-322ce",
  storageBucket: "shared-calendar-322ce.firebasestorage.app",
  messagingSenderId: "724619035853",
  appId: "1:724619035853:web:d471cc950cf27990c49584"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);

    // ----------------------------------------------------

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const fixedHolidays = {
      '01-01': '신정', '03-01': '삼일절', '05-05': '어린이날',
      '06-06': '현충일', '08-15': '광복절', '10-03': '개천절',
      '10-09': '한글날', '12-25': '성탄절'
    };

    let currentDate = new Date();
    let events = [];
    let currentUser = "익명";

    const monthYearText = document.getElementById('monthYear');
    const calendarGrid = document.getElementById('calendarGrid');
    const eventForm = document.getElementById('eventForm');
    const eventTitleInput = document.getElementById('eventTitle');
    const eventDateInput = document.getElementById('eventDate');
    const eventCategorySelect = document.getElementById('eventCategory');
    const eventList = document.getElementById('eventList');

    // 비밀번호 확인
    document.getElementById('btnAuth').addEventListener('click', () => {
      const inputPass = document.getElementById('accessPassword').value;
      const inputName = document.getElementById('userName').value.trim();

      if (inputPass === SHARE_PASSWORD) {
        currentUser = inputName || "익명";
        document.getElementById('authOverlay').style.display = 'none';
        initApp();
      } else {
        alert("비밀번호가 올바르지 않습니다.");
      }
    });

    function initApp() {
      eventDateInput.value = formatDate(new Date());

      // Firebase 실시간 리스너 (누군가 변경하면 자동 업데이트)
      onSnapshot(collection(db, "shared_events"), (snapshot) => {
        events = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));
        renderCalendar();
        renderEventList();
      });

      document.getElementById('prevBtn').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
      });
      document.getElementById('nextBtn').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
      });
      document.getElementById('todayBtn').addEventListener('click', () => {
        currentDate = new Date();
        renderCalendar();
      });

      // 일정 추가 (Firestore DB에 전송)
      eventForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          await addDoc(collection(db, "shared_events"), {
            title: eventTitleInput.value,
            date: eventDateInput.value,
            category: eventCategorySelect.value,
            author: currentUser,
            createdAt: new Date()
          });
          eventTitleInput.value = '';
        } catch (err) {
          alert("일정 추가 중 오류가 발생했습니다: " + err.message);
        }
      });
    }

    function formatDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getHolidayName(dateStr) {
      const monthDay = dateStr.slice(5);
      return fixedHolidays[monthDay] || null;
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      monthYearText.textContent = `${year}년 ${month + 1}월`;
      calendarGrid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const todayStr = formatDate(new Date());

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.classList.add('day-cell', 'empty');
        calendarGrid.appendChild(emptyCell);
      }

      for (let day = 1; day <= lastDate; day++) {
        const cellDate = new Date(year, month, day);
        const dayOfWeek = cellDate.getDay();
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const holidayName = getHolidayName(dateStr);

        const dayCell = document.createElement('div');
        dayCell.classList.add('day-cell');

        if (dayOfWeek === 0) dayCell.classList.add('sun');
        if (dayOfWeek === 6) dayCell.classList.add('sat');
        if (holidayName) dayCell.classList.add('holiday');
        if (dateStr === todayStr) dayCell.classList.add('today');

        dayCell.innerHTML = `<div class="day-number">${day}</div>`;

        const dotsContainer = document.createElement('div');
        dotsContainer.classList.add('event-dots');

        if (holidayName) {
          const holidayBadge = document.createElement('div');
          holidayBadge.classList.add('event-badge', 'bg-holiday');
          holidayBadge.textContent = holidayName;
          dotsContainer.appendChild(holidayBadge);
        }

        const dayEvents = events.filter(e => e.date === dateStr);
        dayEvents.forEach(e => {
          const badge = document.createElement('div');
          badge.classList.add('event-badge', `bg-${e.category}`);
          badge.textContent = `${e.title}`;
          dotsContainer.appendChild(badge);
        });

        if (holidayName || dayEvents.length > 0) {
          dayCell.appendChild(dotsContainer);
        }

        dayCell.addEventListener('click', () => {
          eventDateInput.value = dateStr;
        });

        calendarGrid.appendChild(dayCell);
      }
    }

    function renderEventList() {
      eventList.innerHTML = '';
      const sortedEvents = [...events].sort((a, b) => new Date(a.date) - new Date(b.date));

      if (sortedEvents.length === 0) {
        eventList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem;">등록된 일정이 없습니다.</p>';
        return;
      }

      sortedEvents.forEach(e => {
        const item = document.createElement('div');
        item.classList.add('event-item');
        item.innerHTML = `
          <div class="event-info">
            <span class="event-title">${escapeHtml(e.title)}</span>
            <span class="event-author">작성자: ${escapeHtml(e.author || '익명')}</span>
            <span class="event-date">${e.date}</span>
          </div>
          <button class="btn-delete" data-id="${e.id}">&times;</button>
        `;
        
        item.querySelector('.btn-delete').addEventListener('click', () => deleteEvent(e.id));
        eventList.appendChild(item);
      });
    }

    async function deleteEvent(id) {
      if (confirm("이 일정을 삭제하시겠습니까?")) {
        await deleteDoc(doc(db, "shared_events", id));
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
